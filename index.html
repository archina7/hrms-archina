<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건설 인사관리시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f3f5f8;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #1e3a5f;
    --primary-soft: #e8eef6;
    --accent: #f59e0b;
    --ok: #15803d;      --ok-bg: #dcfce7;
    --warn: #b45309;    --warn-bg: #fef3c7;
    --danger: #b91c1c;  --danger-bg: #fee2e2;
    --info: #1d4ed8;    --info-bg: #dbeafe;
    --gray: #4b5563;    --gray-bg: #f3f4f6;
    --radius: 10px;
    --gap: 16px;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  button, input, select { font: inherit; }
  a { color: var(--info); }

  /* ----- 레이아웃 ----- */
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 210px; background: var(--primary); color: #fff; flex-shrink: 0; position: sticky; top: 0; height: 100vh; }
  .brand { padding: 20px 18px; font-weight: 700; font-size: 17px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .brand small { display: block; font-weight: 400; font-size: 12px; opacity: .7; }
  #nav a { display: flex; gap: 10px; align-items: center; padding: 11px 18px; color: #dbe4ef; text-decoration: none; border-left: 3px solid transparent; }
  #nav a:hover { background: rgba(255,255,255,.06); }
  #nav a.active { background: rgba(255,255,255,.1); color: #fff; border-left-color: var(--accent); font-weight: 600; }
  main { flex: 1; min-width: 0; padding: 20px 24px 90px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
  .topbar h1 { margin: 0; font-size: 21px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  #todayLabel { color: var(--muted); }
  .user-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13px; }
  .user-chip .role { font-weight: 600; color: var(--primary); }
  .user-chip.err { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-bg); }
  .btn.auth { background: var(--accent); border-color: var(--accent); color: var(--text); font-weight: 600; }
  .btn.auth .cnt { background: var(--danger); color: #fff; border-radius: 999px; padding: 0 6px; margin-left: 4px; font-size: 12px; }
  .access-add { display: flex; gap: 8px; flex-wrap: wrap; }
  .access-add input { flex: 1; min-width: 200px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .access-add select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; }

  /* ----- 공통 컴포넌트 ----- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: var(--gap); }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .card h3 small { color: var(--muted); font-weight: 400; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .grid2 > .card { margin-bottom: 0; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); margin-bottom: var(--gap); }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 26px; font-weight: 700; margin: 2px 0; }
  .kpi .sub { color: var(--muted); font-size: 12px; }
  .kpi.warn .value { color: var(--warn); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar .spacer { flex: 1; }
  .toolbar input, .toolbar select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; min-width: 0; }
  .toolbar input[type=search] { width: 220px; }
  .btn { padding: 7px 14px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--gray-bg); }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.primary:hover { background: #173150; }
  .btn.danger { color: var(--danger); border-color: #fecaca; }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .icon-btn { border: 0; background: transparent; cursor: pointer; font-size: 18px; padding: 4px 8px; color: inherit; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 9px 16px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
  .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { background: #f9fafb; font-weight: 600; color: #374151; font-size: 13px; position: sticky; top: 0; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: var(--primary-soft); }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #fafbfc; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 700; background: var(--primary-soft); }
  .actions { display: flex; gap: 4px; }
  .link { background: none; border: 0; color: var(--info); cursor: pointer; padding: 0; text-decoration: underline; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .muted { color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .notice { padding: 10px 12px; border-radius: 8px; background: var(--info-bg); color: var(--info); margin-bottom: 12px; }
  .notice.warn { background: var(--warn-bg); color: var(--warn); }

  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.danger { background: var(--danger-bg); color: var(--danger); }
  .badge.info { background: var(--info-bg); color: var(--info); }
  .badge.gray { background: var(--gray-bg); color: var(--gray); }

  .alerts { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
  .alerts li { padding: 7px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .alerts li a { margin-left: auto; font-size: 12px; }
  .bars .row { display: grid; grid-template-columns: 150px 1fr 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .bars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .track { background: var(--gray-bg); border-radius: 4px; height: 14px; }
  .bars .fill { background: var(--primary); height: 100%; border-radius: 4px; }
  .bars .n { text-align: right; font-weight: 600; }

  /* ----- 모달 ----- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .modal.wide { max-width: 860px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { margin: 0; font-size: 17px; }
  .modal-body { padding: 16px 18px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px; }
  #modalForm { padding: 16px 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.wide { grid-column: 1 / -1; }
  .field span { font-size: 13px; font-weight: 600; }
  .field input, .field select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .field input[readonly] { background: var(--gray-bg); }
  .field small { color: var(--muted); font-size: 12px; }
  .req { color: var(--danger); }
  .form-error { color: var(--danger); min-height: 1em; margin: 10px 0 0; }
  .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 16px; margin-bottom: 16px; }
  .info-grid div span { display: block; color: var(--muted); font-size: 12px; }
  .modal h4 { margin: 16px 0 8px; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 80; max-width: calc(100% - 32px); }
  #toast.show { opacity: 1; }

  /* ----- 챗봇 ----- */
  #chatFab { position: fixed; right: 20px; bottom: 20px; z-index: 40; background: var(--accent); color: #1f2937; border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.2); cursor: pointer; }
  #chatPanel { position: fixed; right: 20px; bottom: 76px; width: 380px; height: 560px; max-height: calc(100vh - 100px); background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; z-index: 45; overflow: hidden; }
  #chatPanel[hidden] { display: none; }
  .chat-head { background: var(--primary); color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 8px; }
  .chat-head strong { flex: 1; }
  .chat-head .badge { background: rgba(255,255,255,.18); color: #fff; }
  #chatMsgs { flex: 1; overflow-y: auto; padding: 12px; background: #f8fafc; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 12px; word-break: keep-all; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.bot ul { margin: 6px 0; padding-left: 18px; }
  .msg.bot .go { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .msg.typing { color: var(--muted); font-style: italic; }
  .chips { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; border-top: 1px solid var(--line); }
  .chips button { flex-shrink: 0; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  #chatForm { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  #chatForm input { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; }

  /* ----- 모바일 (현장 사용) ----- */
  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid2 { grid-template-columns: 1fr; }
    .grid2 > .card { margin-bottom: var(--gap); }
  }
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: sticky; top: 0; z-index: 30; }
    .brand { padding: 10px 16px; font-size: 15px; border: 0; }
    .brand small { display: none; }
    #nav { display: flex; overflow-x: auto; scrollbar-width: none; }
    #nav::-webkit-scrollbar { display: none; }
    #nav a { flex-shrink: 0; padding: 9px 12px; border-left: 0; border-bottom: 3px solid transparent; font-size: 13px; }
    #nav a.active { border-bottom-color: var(--accent); }
    main { padding: 14px 16px 90px; }
    .topbar h1 { font-size: 18px; }
    .toolbar input[type=search] { width: 100%; }
    .toolbar .spacer { display: none; }
    .form-grid, .info-grid { grid-template-columns: 1fr; }
    .bars .row { grid-template-columns: 100px 1fr 32px; }
    #chatPanel { right: 8px; left: 8px; width: auto; bottom: 70px; height: calc(100vh - 150px); }
    #chatFab { right: 12px; bottom: 12px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">🏗️ 건설 인사관리<small>Construction HRMS</small></div>
    <nav id="nav" aria-label="주 메뉴"></nav>
  </aside>
  <main>
    <header class="topbar"><h1 id="pageTitle"></h1><div class="topbar-right"><span id="todayLabel"></span><span id="userBox"></span></div></header>
    <section id="view"></section>
  </main>
</div>

<button id="chatFab" data-act="chat-toggle" aria-label="인사 챗봇 열기">💬 인사 챗봇</button>
<div id="chatPanel" hidden role="dialog" aria-label="인사 챗봇">
  <div class="chat-head">
    <strong>인사 챗봇</strong>
    <span class="badge" id="chatModeLabel"></span>
    <button class="icon-btn" data-act="chat-toggle" aria-label="닫기">✕</button>
  </div>
  <div id="chatMsgs" aria-live="polite"></div>
  <div class="chips" id="chatChips"></div>
  <form id="chatForm" autocomplete="off">
    <input id="chatInput" placeholder="예: 자격증 만료 예정자 알려줘" aria-label="질문 입력">
    <button class="btn primary" type="submit">전송</button>
  </form>
</div>

<div id="modalRoot"></div>
<div id="toast" role="status"></div>

<!-- =========================================================
     핵심 로직 (DOM을 사용하지 않는 순수 함수만 둔다)
     data/sample.json 생성 시에도 이 블록만 사용한다.
     ========================================================= -->
<script id="core">
// ===== [공통 상수·유틸] =====
const SCHEMA_VERSION = 1;
const COLLECTIONS = ['employees', 'sites', 'assignments', 'certs', 'trainings', 'attendance', 'payroll', 'chatLogs'];
const DEPTS = ['공사팀', '공무팀', '안전팀', '품질팀', '인사총무팀', '현장인력'];
const POSITIONS = ['부장', '차장', '과장', '대리', '사원', '기능공', '조공'];
const EMP_TYPES = ['정규', '계약', '일용'];
const CERT_TYPES = ['건축기사', '토목기사', '건축산업기사', '건설안전기사', '산업안전기사', '건설안전산업기사', '철근기능사', '건축목공기능사', '건설기계조종사면허(굴착기)', '타워크레인 조종사면허', '고소작업대 운전 교육(사내)', '응급처치(CPR) 수료증'];
const BASIC_TRAINING = '건설업 기초안전보건교육';
const TRAINING_TYPES = [BASIC_TRAINING, '정기 안전보건교육(반기)', '관리감독자 안전보건교육(연간)', '특별안전보건교육', 'MSDS 교육'];
const OPEN_END = '9999-12-31';
const ALERT_DAYS = 30;

function pad2(n) { return String(n).padStart(2, '0'); }
function fmtDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); }
function diffDays(from, to) { return Math.round((parseDate(to) - parseDate(from)) / 86400000); }
function monthOf(s) { return s.slice(0, 7); }
function monthRange(ym) {
  const [y, m] = ym.split('-').map(Number);
  return { start: ym + '-01', end: ym + '-' + pad2(new Date(y, m, 0).getDate()) };
}
function prevMonth(ym) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 2, 1); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseDate(s)); }
function won(n) { return Math.round(n || 0).toLocaleString('ko-KR') + '원'; }
function num(n) { return Math.round(n || 0).toLocaleString('ko-KR'); }
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function maskAccount(s) {
  if (!s) return '';
  const p = s.split('-');
  if (p.length < 3) return s.slice(0, 3) + '****' + s.slice(-2);
  return p[0] + '-****-' + p[p.length - 1];
}
function overlaps(s1, e1, s2, e2) { return s1 <= (e2 || OPEN_END) && s2 <= (e1 || OPEN_END); }
function floor10(n) { return Math.floor(n / 10) * 10; }

// ===== [도메인 조회] =====
function findEmp(data, empNo) { return data.employees.find(e => e.empNo === empNo); }
function findSite(data, code) { return data.sites.find(s => s.code === code); }
function activeAssignment(data, empNo, date) {
  return data.assignments.find(a => a.empNo === empNo && a.startDate <= date && (a.endDate || OPEN_END) >= date);
}
function staffOnSite(data, code, date) {
  return data.assignments.filter(a => a.siteCode === code && a.startDate <= date && (a.endDate || OPEN_END) >= date);
}
/** 만료일/기한 상태: none(기한 없음) / expired / soon(30일 이내) / ok */
function expiryStatus(dateStr, today) {
  if (!dateStr) return { key: 'none', label: '기한 없음', cls: 'gray', days: Infinity };
  const d = diffDays(today, dateStr);
  if (d < 0) return { key: 'expired', label: `만료 (${-d}일 경과)`, cls: 'danger', days: d };
  if (d <= ALERT_DAYS) return { key: 'soon', label: `임박 (D-${d})`, cls: 'warn', days: d };
  return { key: 'ok', label: '정상', cls: 'ok', days: d };
}
/** 현장 배치 시 확인할 안전 문제 목록 */
function safetyIssues(data, empNo, today) {
  const issues = [];
  const emp = findEmp(data, empNo);
  data.certs.filter(c => c.empNo === empNo && c.expiryDate && c.expiryDate < today)
    .forEach(c => issues.push(`자격 만료: ${c.type} (${c.expiryDate})`));
  data.trainings.filter(t => t.empNo === empNo && t.nextDueDate && t.nextDueDate < today)
    .forEach(t => issues.push(`교육 기한 경과: ${t.name} (${t.nextDueDate})`));
  if (emp && emp.empType === '일용' && !data.trainings.some(t => t.empNo === empNo && t.name === BASIC_TRAINING)) {
    issues.push(`${BASIC_TRAINING} 미이수`);
  }
  return issues;
}
function siteStatus(site, today) {
  if (today < site.startDate) return { label: '착공 전', cls: 'gray' };
  if (today > site.endDate) return { label: '준공', cls: 'gray' };
  const d = diffDays(today, site.endDate);
  if (d <= ALERT_DAYS) return { label: `준공 임박 (D-${d})`, cls: 'warn' };
  return { label: '진행 중', cls: 'ok' };
}
/** 대시보드·챗봇 공용: 조치가 필요한 항목 */
function getAlerts(data, today) {
  const out = [];
  const activeEmp = empNo => { const e = findEmp(data, empNo); return e && e.status === '재직' ? e : null; };
  data.certs.forEach(c => {
    const e = activeEmp(c.empNo); if (!e) return;
    const s = expiryStatus(c.expiryDate, today);
    if (s.key === 'expired' || s.key === 'soon')
      out.push({ level: s.key === 'expired' ? 'danger' : 'warn', category: '자격증', text: `${e.name} · ${c.type} ${s.label}`, view: 'certs', days: s.days });
  });
  data.trainings.forEach(t => {
    const e = activeEmp(t.empNo); if (!e) return;
    const s = expiryStatus(t.nextDueDate, today);
    if (s.key === 'expired' || s.key === 'soon')
      out.push({ level: s.key === 'expired' ? 'danger' : 'warn', category: '교육', text: `${e.name} · ${t.name} ${s.key === 'expired' ? '기한 경과' : '기한 ' + s.label}`, view: 'certs', days: s.days });
  });
  data.employees.filter(e => e.status === '재직' && e.empType === '일용' && activeAssignment(data, e.empNo, today))
    .filter(e => !data.trainings.some(t => t.empNo === e.empNo && t.name === BASIC_TRAINING))

const PAY_RATES = {
  pension: 0.0475,      // 국민연금
  health: 0.03595,      // 건강보험
  ltc: 0.1314,          // 장기요양 (건강보험료 대비)
  employment: 0.009,    // 고용보험
  meal: 200000,         // 식대 (비과세, 정규·계약)
  dailyTaxFree: 150000, // 일용근로소득 1일 공제
  dailyTaxRate: 0.027,  // 일용 소득세 (6% × (1-55%))
  salaryTaxRate: 0.03,  // 정규·계약 소득세 개략
  localTax: 0.1,        // 지방소득세 (소득세의 10%)
  otRate: 1.5,          // 연장근로 가산
  monthlyHours: 209,    // 월 소정근로시간
  standardHours: 8,

function calcPayroll(data, ym) {
  const r = PAY_RATES;
  const { start, end } = monthRange(ym);
  const rows = [];
  for (const e of data.employees) {
    if (e.hireDate > end) continue;
    if (e.leaveDate && e.leaveDate < start) continue;
    const att = data.attendance.filter(a => a.empNo === e.empNo && a.present && a.date >= start && a.date <= end);
    const days = att.length;
    const otHours = att.reduce((s, a) => s + Math.max(0, (Number(a.hours) || 0) - r.standardHours), 0);
    const daily = e.empType === '일용';
    if (daily && days === 0) continue;
    const base = daily ? (e.dailyWage || 0) * days : (e.baseSalary || 0);
    const hourly = daily ? (e.dailyWage || 0) / r.standardHours : (e.baseSalary || 0) / r.monthlyHours;
    const overtime = floor10(otHours * hourly * r.otRate);
    const meal = daily ? 0 : r.meal;
    const gross = base + overtime + meal;
    const taxable = gross - meal;
    const insured = !daily || days >= r.insuredMinDays;
    const pension = insured ? floor10(taxable * r.pension) : 0;
    const health = insured ? floor10(taxable * r.health) : 0;
    const ltc = insured ? floor10(health * r.ltc) : 0;
    const employment = floor10(taxable * r.employment);
    const incomeTax = daily
      ? floor10(Math.max(0, taxable / days - r.dailyTaxFree) * r.dailyTaxRate * days)
      : floor10(taxable * r.salaryTaxRate);
    const localTax = floor10(incomeTax * r.localTax);
    const deduction = pension + health + ltc + employment + incomeTax + localTax;
    rows.push({
      empNo: e.empNo, name: e.name, empType: e.empType, month: ym, days, otHours,
      base, overtime, meal, gross, pension, health, ltc, employment, incomeTax, localTax, deduction, net: gross - deduction,
    });
  }
  return rows;
}

    ['E2026028', '건축목공기능사', '2017-07-14', ''],
    ['E2026034', '배관기능사', '2010-10-15', ''],
    ['E2026035', '건설기계조종사면허(굴착기)', '2013-02-20', '2026-11-10'],
    ['E2026037', '용접기능사', '2018-03-30', ''],
  ].map(([empNo, type, acquiredDate, expiryDate]) => ({ empNo, type, acquiredDate, expiryDate })));

  const trainings = mk('trn', [
    ['E2025010', BASIC_TRAINING, '2025-06-05', ''],
    ['E2025011', BASIC_TRAINING, '2026-01-10', ''],
    ['E2026012', BASIC_TRAINING, '2026-02-27', ''],
    ['E2026013', BASIC_TRAINING, '2026-04-02', ''],
    ['E2019003', '정기 안전보건교육(반기)', '2026-06-10', '2026-12-10'],
    ['E2023007', '정기 안전보건교육(반기)', '2026-05-20', '2026-11-20'],
    ['E2024008', '정기 안전보건교육(반기)', '2026-04-15', '2026-10-15'],
    ['E2021005', '정기 안전보건교육(반기)', '2026-07-01', '2027-01-01'],
    ['E2015001', '관리감독자 안전보건교육(연간)', '2025-12-01', '2026-12-01'],
    ['E2020004', '관리감독자 안전보건교육(연간)', '2025-10-20', '2026-10-20'],
    ['E2017002', '관리감독자 안전보건교육(연간)', '2026-03-15', '2027-03-15'],
    ['E2022006', '관리감독자 안전보건교육(연간)', '2026-08-20', '2027-08-20'],
    // --- 샘플 v2 (E2026023 차민서는 기초안전보건교육 미이수 사례) ---
    ...['E2026019:2026-01-28', 'E2026020:2026-01-28', 'E2026021:2026-03-05', 'E2026022:2026-04-09', 'E2026027:2026-06-10',
      'E2026028:2026-06-10', 'E2026029:2026-06-26', 'E2026030:2026-07-16', 'E2026031:2026-07-30', 'E2026034:2026-07-29',
      'E2026035:2026-07-29', 'E2026036:2026-08-06', 'E2026037:2026-08-27'].map(s => { const [e, d] = s.split(':'); return [e, BASIC_TRAINING, d, '']; }),
    ['E2020017', '정기 안전보건교육(반기)', '2026-08-10', '2027-02-10'],
    ['E2024026', '정기 안전보건교육(반기)', '2026-05-30', '2026-11-30'],
    ['E2025033', '정기 안전보건교육(반기)', '2026-04-20', '2026-10-20'],
    ['E2022025', '정기 안전보건교육(반기)', '2026-09-01', '2027-03-01'],
    ['E2023018', '정기 안전보건교육(반기)', '2026-07-15', '2027-01-15'],
    ['E2014016', '관리감독자 안전보건교육(연간)', '2026-02-20', '2027-02-20'],
    ['E2016024', '관리감독자 안전보건교육(연간)', '2025-11-28', '2026-11-28'],
    ['E2019032', '관리감독자 안전보건교육(연간)', '2026-01-12', '2027-01-12'],
  ].map(([empNo, name, completedDate, nextDueDate]) => ({ empNo, name, completedDate, nextDueDate })));

  // 근태: 2026-10-01 ~ 2026-11-19 (일요일·공휴일 제외, 토요일은 일용직 일부만 출역)
  const HOLIDAYS = new Set(['2026-10-03', '2026-10-05', '2026-10-09']);
  // v1 인원은 기존 난수열을 그대로 써서 v1과 같은 출역이 나오게 하고, v2 인원은 별도 난수열을 쓴다
  const randV1 = mulberry32(20261119), randV2 = mulberry32(20261120);
  const attendance = [];
  const base = { employees, sites, assignments };
  for (let d = '2026-10-01'; d <= '2026-11-19'; d = addDays(d, 1)) {
    const dow = parseDate(d).getDay();
    if (dow === 0 || HOLIDAYS.has(d)) continue;
    for (const e of employees) {
      if (e.leaveDate && d > e.leaveDate) continue;
      const a = activeAssignment(base, e.empNo, d);
      if (!a) continue;
      const rand = SAMPLE_V1_EMPNOS.has(e.empNo) ? randV1 : randV2;
      const daily = e.empType === '일용';
      if (dow === 6 && (!daily || rand() < 0.5)) continue;
      if (rand() > 0.93) continue;
      const hours = rand() < 0.25 ? 10 : 8;
      attendance.push({ id: `att-${attendance.length + 1}`, empNo: e.empNo, date: d, siteCode: a.siteCode, present: true, hours, createdAt: TS, updatedAt: TS });
    }
  }

  const data = { employees, sites, assignments, certs, trainings, attendance, payroll: [], chatLogs: [] };
  data.payroll = calcPayroll(data, '2026-10').map((r, i) => ({ id: `pay-${i + 1}`, ...r, confirmedAt: '2026-11-05T10:00:00', createdAt: TS, updatedAt: TS }));
  return data;
}
// ===== [샘플 데이터 끝] =====
</script>

<!-- =========================================================
     화면 (UI)
     ========================================================= -->
<script>
// ===== [저장소] =====
const Store = {
  get(key, fallback) {
    try { const v = localStorage.getItem('hrms_' + key); return v == null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem('hrms_' + key, JSON.stringify(val)); return true; }
    catch (e) { toast('저장 실패: 브라우저 저장공간을 확인하세요.'); return false; }
  },
  remove(key) { try { localStorage.removeItem('hrms_' + key); } catch (e) { /* 무시 */ } },
};

const App = {
  data: {},
  view: 'dashboard',
  filters: {},
  sort: {},
  chat: { open: false, busy: false, turns: [] },
  me: null,       // 로그인 사용자 { email, name, role, isAdmin, pendingCount } — 배포 사이트에서만
  access: null,   // 접근 관리 상태 { superAdmins, users, pending } — 관리자만
};

function loadData() {
  Store.remove('apiKey'); // 이전 버전에서 브라우저에 저장했던 API 키 정리 (키는 이제 서버에서만 관리)
  const ver = Store.get('schemaVersion', null);
  if (ver == null) { resetToSample(); return; }
  COLLECTIONS.forEach(c => { const v = Store.get(c, []); App.data[c] = Array.isArray(v) ? v : []; });
  migrate(ver);
  upgradeSample();
}
/** 샘플을 쓰고 있는 브라우저에 새 버전 샘플(추가 현장·인원)만 합친다. 직접 입력·수정한 데이터는 유지된다. */
function upgradeSample() {
  const from = Store.get('sampleVersion', 1);
  if (from >= SAMPLE_VERSION) return;
  if (App.data.employees.some(e => SAMPLE_V1_EMPNOS.has(e.empNo))) {
    const added = mergeNewSample(App.data, buildSampleData());
    if (added.employees || added.sites) {
      saveAll();
      setTimeout(() => toast(`새 샘플 데이터 추가: 현장 ${added.sites}곳, 직원 ${added.employees}명`), 300);
    }
  }
  Store.set('sampleVersion', SAMPLE_VERSION);
}
/** 스키마 변경 시 버전별 변환을 여기에 추가한다. */
function migrate(fromVersion) {
  // 예) if (fromVersion < 2) { App.data.employees.forEach(e => e.newField ??= ''); }
  if (fromVersion !== SCHEMA_VERSION) Store.set('schemaVersion', SCHEMA_VERSION);
}
function saveCol(c) { Store.set(c, App.data[c]); }
function saveAll() { COLLECTIONS.forEach(saveCol); Store.set('schemaVersion', SCHEMA_VERSION); }
function resetToSample() { App.data = buildSampleData(); saveAll(); Store.set('sampleVersion', SAMPLE_VERSION); }
function today() { return fmtDate(new Date()); }
function uid() { return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function stamp(o, isNew) {
  const now = new Date().toISOString();
  if (isNew) { o.id = uid(); o.createdAt = now; }
  o.updatedAt = now;
  return o;
}
function empLabel(empNo) { const e = findEmp(App.data, empNo); return e ? `${e.name} (${e.empNo})` : empNo; }
function siteName(code) { const s = findSite(App.data, code); return s ? s.name : code; }
function F(key, def = '') { return App.filters[key] ?? def; }

// ===== [공통 화면 부품] =====
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400);
}
function badge(text, cls) { return `<span class="badge ${cls}">${esc(text)}</span>`; }
function typeBadge(t) { return badge(t, t === '정규' ? 'info' : t === '계약' ? 'gray' : 'warn'); }
function sel(filterKey, options, current, allLabel) {
  return `<select data-filter="${filterKey}" aria-label="${esc(allLabel || filterKey)}">${allLabel ? `<option value="">${esc(allLabel)}</option>` : ''}${options.map(o => {
    const [v, l] = Array.isArray(o) ? o : [o, o];
    return `<option value="${esc(v)}" ${String(v) === String(current) ? 'selected' : ''}>${esc(l)}</option>`;
  }).join('')}</select>`;
}
function cmp(x, y) {
  if (typeof x === 'number' && typeof y === 'number') return x - y;
  return String(x ?? '').localeCompare(String(y ?? ''), 'ko');
}
/** 정렬 가능한 표. columns: {key, label, render?, sortValue?, num?} */
function table(id, columns, rows, totalRow) {
  const s = App.sort[id];
  if (s) {
    const col = columns.find(c => c.key === s.key);
    if (col) {
      const val = col.sortValue || (r => r[col.key]);
      rows = [...rows].sort((a, b) => cmp(val(a), val(b)) * s.dir);
    }
  }
  if (!rows.length) return `<div class="table-wrap"><div class="empty">표시할 데이터가 없습니다.</div></div>`;
  const head = columns.map(c => {
    const sortable = c.key && c.sortable !== false;
    const arrow = s && s.key === c.key ? (s.dir > 0 ? ' ▲' : ' ▼') : '';
    return `<th class="${sortable ? 'sortable' : ''} ${c.num ? 'num' : ''}" ${sortable ? `data-act="sort" data-id="${id}|${c.key}"` : ''}>${esc(c.label)}${arrow}</th>`;
  }).join('');
  const body = rows.map(r => `<tr>${columns.map(c => `<td class="${c.num ? 'num' : ''}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('')}</tr>`).join('');
  const total = totalRow ? `<tr class="total">${columns.map(c => `<td class="${c.num ? 'num' : ''}">${totalRow[c.key] ?? ''}</td>`).join('')}</tr>` : '';
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}${total}</tbody></table></div>`;
}
function btn(label, act, id, cls = '') { return `<button class="btn sm ${cls}" data-act="${act}" data-id="${esc(id)}">${esc(label)}</button>`; }

// ----- 모달 -----
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function fieldHtml(values) {
  return f => {
    const v = values[f.key] ?? f.default ?? '';
    const req = f.required ? ' <b class="req">*</b>' : '';
    let input;
    if (f.type === 'select') {
      input = `<select name="${f.key}">${f.options.map(o => {
        const [val, lab] = Array.isArray(o) ? o : [o, o];
        return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`;
      }).join('')}</select>`;
    } else {
      const list = f.suggestions ? `list="dl-${f.key}"` : '';
      input = `<input name="${f.key}" type="${f.type || 'text'}" value="${esc(v)}" ${list} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} ${f.readonly ? 'readonly' : ''} ${f.type === 'number' ? 'min="0" step="any"' : ''}>`;
      if (f.suggestions) input += `<datalist id="dl-${f.key}">${f.suggestions.map(s => `<option value="${esc(s)}">`).join('')}</datalist>`;
    }
    return `<label class="field ${f.wide ? 'wide' : ''}"><span>${esc(f.label)}${req}</span>${input}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</label>`;
  };
}
/** 입력 폼 모달. onSubmit이 문자열을 반환하면 오류로 표시하고 닫지 않는다. */
function openForm({ title, fields, values = {}, submitLabel = '저장', onSubmit }) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="modal-close" aria-label="닫기">✕</button></div>
    <form id="modalForm" novalidate>
      <div class="form-grid">${fields.map(fieldHtml(values)).join('')}</div>
      <p class="form-error" id="formError"></p>
      <div class="modal-foot"><button type="button" class="btn" data-act="modal-close">취소</button><button type="submit" class="btn primary">${esc(submitLabel)}</button></div>
    </form></div></div>`;
  const form = document.getElementById('modalForm');
  const showErr = m => { document.getElementById('formError').textContent = m; };
  form.addEventListener('submit', ev => {
    ev.preventDefault();
    const v = {};
    fields.forEach(f => {
      let x = form.elements[f.key].value.trim();
      if (f.type === 'number') x = x === '' ? 0 : Number(x);
      v[f.key] = x;
    });
    const miss = fields.find(f => f.required && (v[f.key] === '' || v[f.key] == null));
    if (miss) { showErr(`${miss.label}은(는) 필수 입력입니다.`); return; }
    const bad = fields.find(f => f.type === 'date' && v[f.key] && !isDate(v[f.key]));
    if (bad) { showErr(`${bad.label}은(는) YYYY-MM-DD 형식이어야 합니다.`); return; }
    const res = onSubmit(v);
    if (typeof res === 'string') { showErr(res); return; }
    closeModal(); render();
  });
  const first = form.querySelector('input:not([readonly]), select');
  if (first) first.focus();
}
function openInfo(title, html, wide = true) {
  document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="modal-close" aria-label="닫기">✕</button></div>
    <div class="modal-body">${html}</div></div></div>`;
}
function exportXlsx(filename, sheetName, rows) {
  if (!rows.length) { toast('내보낼 데이터가 없습니다.'); return; }
  if (!window.XLSX) { toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName);
  XLSX.writeFile(wb, filename);
}
function downloadText(filename, text, type = 'application/json') {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ===== [라우팅·렌더링] =====
const MENU = [
  ['dashboard', '대시보드', '📊'],
  ['employees', '사원 관리', '👷'],
  ['sites', '현장 배치', '🏗️'],
  ['certs', '자격·교육', '📜'],
  ['attendance', '근태', '🗓️'],
  ['payroll', '급여', '💰'],
  ['settings', '설정', '⚙️'],
];
const ACCESS_MENU = ['access', '접근 관리', '🔐'];
function menuItems() { return App.me && App.me.isAdmin ? [...MENU, ACCESS_MENU] : MENU; }
const ROLE_LABEL = { superadmin: '최고 관리자', admin: '관리자', user: '사용자' };
const VIEWS = {};
const ACTIONS = {};

function render() {
  const active = document.activeElement;
  const focus = active && active.dataset && active.dataset.filter
    ? { f: active.dataset.filter, pos: (() => { try { return active.selectionStart; } catch (e) { return null; } })() } : null;
  const items = menuItems();
  if (!items.some(m => m[0] === App.view)) App.view = 'dashboard';
  const pending = App.me && App.me.isAdmin ? App.me.pendingCount : 0;
  document.getElementById('nav').innerHTML = items.map(([k, l, i]) =>
    `<a href="#" data-act="nav" data-id="${k}" class="${App.view === k ? 'active' : ''}"><span aria-hidden="true">${i}</span>${l}${k === 'access' && pending ? ` (${pending})` : ''}</a>`).join('')
    // 배포 사이트에서는 로그인 정보 확인이 실패해도 로그아웃 링크를 항상 보여 준다
    + (location.protocol !== 'file:' ? '<a href="/logout"><span aria-hidden="true">🚪</span>로그아웃</a>' : '');
  document.getElementById('pageTitle').textContent = items.find(m => m[0] === App.view)[1];
  document.getElementById('todayLabel').textContent = '기준일 ' + today();
  document.getElementById('userBox').innerHTML = App.me
    ? `<span class="user-chip" title="구글 이메일 인증 완료">✓ ${esc(App.me.email)} · <span class="role">${esc(ROLE_LABEL[App.me.role] || App.me.role)}</span></span>`
      + (App.me.isAdmin ? ` <button class="btn auth" data-act="nav" data-id="access">🔐 접근관리 권한인증${pending ? `<span class="cnt">${pending}</span>` : ''}</button>` : '')
    : App.meError
      ? `<span class="user-chip err" title="${esc(App.meError)}">⚠ 로그인 정보 확인 실패 — 새로고침해 주세요</span>`
      : '';
  document.getElementById('view').innerHTML = VIEWS[App.view]();
  if (focus) {
    const el = document.querySelector(`[data-filter="${focus.f}"]`);
    if (el) { el.focus(); try { if (focus.pos != null) el.setSelectionRange(focus.pos, focus.pos); } catch (e) { /* 날짜 입력 등 */ } }
  }
}
ACTIONS.nav = id => { App.view = id; render(); window.scrollTo(0, 0); if (id === 'access') loadAccessState(); };
ACTIONS.sort = id => {
  const [tid, key] = id.split('|');
  const s = App.sort[tid];
  App.sort[tid] = s && s.key === key ? { key, dir: -s.dir } : { key, dir: 1 };
  render();
};
ACTIONS['modal-close'] = closeModal;

// ===== [대시보드] =====
function kpi(label, value, sub = '', cls = '') {
  return `<div class="kpi ${cls}"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="sub">${esc(sub)}</div></div>`;
}
VIEWS.dashboard = () => {
  const d = App.data, t = today();
  const active = d.employees.filter(e => e.status === '재직');
  const running = d.sites.filter(s => s.startDate <= t && s.endDate >= t);
  const todayAtt = d.attendance.filter(a => a.date === t && a.present);
  const alerts = getAlerts(d, t);
  const counts = d.sites.map(s => ({ s, n: staffOnSite(d, s.code, t).length }));
  const max = Math.max(1, ...counts.map(x => x.n));
  const byType = EMP_TYPES.map(k => `${k} ${active.filter(e => e.empType === k).length}`).join(' · ');
  const shown = alerts.slice(0, 15);
  return `
    <div class="kpis">
      ${kpi('재직 인원', active.length + '명', byType)}
      ${kpi('운영 중 현장', running.length + '곳', `전체 ${d.sites.length}곳`)}
      ${kpi('오늘 출역', todayAtt.length + '명', t)}
      ${kpi('조치 필요', alerts.length + '건', `만료·임박 ${ALERT_DAYS}일 기준`, alerts.length ? 'warn' : '')}
    </div>
    <div class="grid2">
      <div class="card"><h3>조치 필요 항목</h3>
        ${alerts.length ? `<ul class="alerts">${shown.map(a => `<li>${badge(a.category, a.level)} <span>${esc(a.text)}</span><a href="#" data-act="nav" data-id="${a.view}">보기</a></li>`).join('')}</ul>
          ${alerts.length > shown.length ? `<p class="note">외 ${alerts.length - shown.length}건</p>` : ''}`
        : '<div class="empty">조치가 필요한 항목이 없습니다.</div>'}

ACTIONS['att-save'] = () => {
  const d = App.data;
  let date = F('att.date', today()); if (!isDate(date)) date = today();
  let added = 0, removed = 0;
  for (const tr of document.querySelectorAll('#attTable tbody tr')) {
    const empNo = tr.dataset.emp, siteCode = tr.dataset.site;
    const checked = tr.querySelector('.att-chk').checked;
    const hours = Number(tr.querySelector('.att-hrs').value);
    if (checked && !(hours > 0 && hours <= 24)) { toast(`${empLabel(empNo)}: 근무시간은 0~24 사이여야 합니다.`); return; }
    const rec = d.attendance.find(x => x.empNo === empNo && x.date === date);
    if (checked) {
      if (rec) Object.assign(rec, stamp({ present: true, hours, siteCode }, false));
      else { d.attendance.push(stamp({ empNo, date, siteCode, present: true, hours }, true)); added++; }
    } else if (rec) { d.attendance = d.attendance.filter(x => x !== rec); removed++; }
  }
  saveCol('attendance'); render(); toast(`출역을 저장했습니다. (신규 ${added}건, 취소 ${removed}건)`);
};

// ===== [접근 관리 (관리자)] =====
// 서버(functions/_middleware.js)의 /api/me, /api/access를 사용한다. 권한 판단은 서버에서 하고 화면은 표시만 한다.
async function apiJson(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `오류 ${res.status}`);
  return data;
}
async function loadMe() {
  if (location.protocol === 'file:') return;
  try { App.me = await apiJson('/api/me'); App.meError = null; }
  catch (e) { App.meError = e.message; console.warn('로그인 정보 확인 실패:', e.message); }
  render();
}
async function loadAccessState() {
  if (!App.me || !App.me.isAdmin) return;
  try {
    App.access = await apiJson('/api/access');
    App.me.pendingCount = App.access.pending.length;
  } catch (e) { App.access = { error: e.message }; }
  render();
}
async function accessAction(body, okMsg) {
  try {
    App.access = await apiJson('/api/access', body);
    App.me.pendingCount = App.access.pending.length;
    render(); toast(okMsg);
  } catch (e) { toast('실패: ' + e.message); }
}
/** 서버에 UTC로 저장된 시각을 브라우저 현지 시각(한국 시간)으로 표시 */
const dt = s => { if (!s) return '-'; const d = new Date(s); return isNaN(d) ? esc(s) : esc(`${fmtDate(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`); };

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); } catch (e) { toast('JSON 형식이 올바르지 않습니다.'); return; }
    if (!obj || !Array.isArray(obj.employees)) { toast('인사관리 데이터 파일이 아닙니다 (employees 없음).'); return; }
    if (!confirm(`사원 ${obj.employees.length}명 등 데이터를 가져와 현재 데이터를 덮어쓸까요?`)) return;
    COLLECTIONS.forEach(c => { App.data[c] = Array.isArray(obj[c]) ? obj[c] : []; });
    saveAll(); migrate(Number(obj.schemaVersion) || SCHEMA_VERSION); render(); toast('데이터를 가져왔습니다.');
  };
  reader.readAsText(file, 'utf-8');
}

function targetMonth(q, t) {
  if (/지난\s?달|전월|저번\s?달/.test(q)) return prevMonth(monthOf(t));
  const m = q.match(/(\d{1,2})\s*월/);
  if (m && +m[1] >= 1 && +m[1] <= 12) return t.slice(0, 4) + '-' + pad2(+m[1]);
  return monthOf(t);
}

    || s.name.split(/\s+/).some(w => w.length >= 2 && !GENERIC_SITE_WORDS.includes(w) && q.includes(w)));
  return { emps, site, t: today() };
}

    handle: (q, { t }) => {
      const rows = App.data.certs.map(c => ({ c, e: findEmp(App.data, c.empNo), s: expiryStatus(c.expiryDate, t) }))
        .filter(x => x.e && x.e.status === '재직' && (x.s.key === 'expired' || x.s.key === 'soon'))
        .sort((a, b) => a.s.days - b.s.days);
      if (!rows.length) return `만료됐거나 ${ALERT_DAYS}일 이내 만료 예정인 자격증이 없습니다.`;
      return `자격증 만료·임박 (${ALERT_DAYS}일 이내) <b>${rows.length}건</b>${list(rows.map(x => `${esc(x.e.name)} — ${esc(x.c.type)} (${esc(x.c.expiryDate)}) ${badge(x.s.label, x.s.cls)}`))}<div class="go">${go('certs', '자격·교육 화면')}</div>`;
    } },

  { name: '교육 기한', keywords: ['교육', '미이수', '이수'],
    handle: (q, { t }) => {
      const d = App.data;
      const due = d.trainings.map(x => ({ x, e: findEmp(d, x.empNo), s: expiryStatus(x.nextDueDate, t) }))
        .filter(r => r.e && r.e.status === '재직' && (r.s.key === 'expired' || r.s.key === 'soon')).sort((a, b) => a.s.days - b.s.days);
      const missing = d.employees.filter(e => e.status === '재직' && e.empType === '일용' && !d.trainings.some(x => x.empNo === e.empNo && x.name === BASIC_TRAINING));
      if (!due.length && !missing.length) return '기한이 지났거나 임박한 교육, 미이수 인원이 없습니다.';
      const items = [
        ...missing.map(e => `${esc(e.name)} — ${BASIC_TRAINING} ${badge('미이수', 'danger')}`),
        ...due.map(r => `${esc(r.e.name)} — ${esc(r.x.name)} (기한 ${esc(r.x.nextDueDate)}) ${badge(r.s.key === 'expired' ? '기한 경과' : r.s.label, r.s.cls)}`),
      ];
      return `안전보건교육 조치 필요 <b>${items.length}건</b>${list(items)}<div class="go">${go('certs', '자격·교육 화면')}</div>`;
    } },

  { name: '오늘 출역', keywords: ['출역', '출근', '오늘'],
    handle: (q, { t }) => {
      const att = App.data.attendance.filter(a => a.date === t && a.present);
      if (!att.length) return `오늘(${t}) 입력된 출역 기록이 없습니다.<div class="go">${go('attendance', '출역 입력하기')}</div>`;
      const by = App.data.sites.map(s => [s.name, att.filter(a => a.siteCode === s.code).length]).filter(x => x[1]);
      return `오늘(${t}) 출역 <b>${att.length}명</b>${list(by.map(([n, c]) => `${esc(n)}: ${c}명`))}<div class="go">${go('attendance', '근태 화면')}</div>`;
    } },

  { name: '급여 합계', keywords: ['급여', '인건비', '노임', '월급'],
    handle: (q, { t }) => {
      const ym = targetMonth(q, t);
      const confirmed = App.data.payroll.filter(p => p.month === ym);
      const rows = confirmed.length ? confirmed : calcPayroll(App.data, ym);
      if (!rows.length) return `${esc(ym)} 급여 내역이 없습니다.`;
      const sum = k => rows.reduce((s, r) => s + r[k], 0);
      return `${esc(ym)} 급여 (${confirmed.length ? '확정' : '예상·개략'}) ${rows.length}명${list([`지급총액 ${won(sum('gross'))}`, `공제 합계 ${won(sum('deduction'))}`, `실지급 합계 <b>${won(sum('net'))}</b>`, `일용직 노임 ${won(rows.filter(r => r.empType === '일용').reduce((s, r) => s + r.gross, 0))}`])}<div class="go">${go('payroll', '급여 화면')}</div>`;
    } },

  { name: '현장 목록', keywords: ['현장'],
    handle: (q, { t }) => `현장 ${App.data.sites.length}곳${list(App.data.sites.map(s => { const st = siteStatus(s, t); return `${esc(s.name)} — 배치 ${staffOnSite(App.data, s.code, t).length}명 ${badge(st.label, st.cls)}`; }))}<div class="go">${go('sites', '현장 배치 화면')}</div>` },

  { name: '인원 현황', keywords: ['인원', '몇 명', '몇명', '직원', '사원', '재직', '현황'],
    handle: (q, { t }) => {
      const act = App.data.employees.filter(e => e.status === '재직');
      const byType = EMP_TYPES.map(k => `${k} ${act.filter(e => e.empType === k).length}명`).join(', ');
      const byDept = DEPTS.map(k => [k, act.filter(e => e.dept === k).length]).filter(x => x[1]).map(([k, n]) => `${esc(k)} ${n}명`);
      const unassigned = act.filter(e => !activeAssignment(App.data, e.empNo, t)).length;
      return `재직 인원 <b>${act.length}명</b> (${byType})${list(byDept)}현장 미배치 ${unassigned}명<div class="go">${go('employees', '사원 관리')}</div>`;
    } },
];

function ruleBot(q) {
  const ctx = chatContext(q);
  for (const it of INTENTS) {
    if (it.needs === 'emp' && !ctx.emps.length) continue;
    if (it.needs === 'site' && !ctx.site) continue;
    if (it.keywords.length && !it.keywords.some(k => q.toLowerCase().includes(k))) continue;
    return it.handle(q, ctx);
  }
  return `해당 정보를 찾을 수 없습니다. 사원 이름, 현장 이름, '자격 만료', '안전교육', '출역', '급여', '연차' 같은 단어를 넣어 다시 질문해 주세요.<div class="go">${go('dashboard', '대시보드')}</div>`;
}

/** AI 모드용 요약 데이터 — 연락처·생년월일·계좌는 포함하지 않는다. */
function aiContextData() {
  const d = App.data, t = today(), ym = monthOf(t), { start, end } = monthRange(ym);
  const pm = prevMonth(ym), prevPay = d.payroll.filter(p => p.month === pm);
  const active = d.employees.filter(e => e.status === '재직');
  return {
    기준일: t,
    // 숫자는 AI가 세지 않도록 미리 계산해서 준다
    요약: {
      재직인원: active.length,
      퇴사인원: d.employees.length - active.length,
      고용형태별_재직: Object.fromEntries(EMP_TYPES.map(k => [k, active.filter(e => e.empType === k).length])),
      부서별_재직: Object.fromEntries(DEPTS.map(k => [k, active.filter(e => e.dept === k).length]).filter(x => x[1])),
      현장미배치_재직: active.filter(e => !activeAssignment(d, e.empNo, t)).length,
      [`${ym}_오늘까지_출역연인원`]: d.attendance.filter(a => a.present && a.date >= start && a.date <= end).length,
    },
    사원: d.employees.map(e => {
      const a = activeAssignment(d, e.empNo, t);
      const att = d.attendance.filter(x => x.empNo === e.empNo && x.present && x.date >= start && x.date <= end);
      return { 사번: e.empNo, 이름: e.name, 부서: e.dept, 직급: e.position, 고용형태: e.empType, 입사일: e.hireDate, 상태: e.status,
        현재현장: a ? siteName(a.siteCode) : null, [`${ym}_출역일수`]: att.length, [`${ym}_근무시간`]: att.reduce((s, x) => s + Number(x.hours || 0), 0) };
    }),
    현장: d.sites.map(s => ({ 코드: s.code, 현장명: s.name, 공사기간: `${s.startDate}~${s.endDate}`, 상태: siteStatus(s, t).label, 현재배치인원: staffOnSite(d, s.code, t).length,
      소장: (findEmp(d, s.managerEmpNo) || {}).name || null })),
    자격증: d.certs.map(c => ({ 사번: c.empNo, 자격: c.type, 만료일: c.expiryDate || null, 상태: expiryStatus(c.expiryDate, t).label })),
    교육: d.trainings.map(x => ({ 사번: x.empNo, 교육명: x.name, 이수일: x.completedDate, 다음기한: x.nextDueDate || null, 상태: expiryStatus(x.nextDueDate, t).label })),
    조치필요: getAlerts(d, t).map(a => `${a.category}: ${a.text}`),
    [`${pm}_확정급여_실지급합계`]: prevPay.length ? prevPay.reduce((s, r) => s + r.net, 0) : null,
  };
}
async function aiBot(q) {
  if (location.protocol === 'file:') throw new Error('파일로 직접 열면 AI 모드를 쓸 수 없음 — 배포 사이트나 wrangler pages dev에서 사용');
  const system = `당신은 건설회사 인사관리시스템의 인사 챗봇입니다. 아래 JSON 데이터만 근거로 한국어로 간결하게 답하세요.
- 데이터에 없는 내용은 지어내지 말고 "해당 정보를 찾을 수 없습니다"라고 답하세요.
- 인원수 등 집계는 '요약' 항목의 값을 그대로 쓰세요. '인원'은 별도 언급이 없으면 상태가 '재직'인 사람만 뜻합니다.
- 명단은 데이터에서 정확히 골라 답하세요. 금액은 천 단위 콤마와 '원', 날짜는 YYYY-MM-DD.
- '만료 임박'은 상태가 '임박'인 것, '만료'는 상태가 '만료'인 것입니다. 둘 다 물으면 구분해서 답하세요.
- 데이터 등록·수정·삭제 요청에는 "챗봇은 조회만 가능합니다. 해당 메뉴에서 직접 처리해 주세요"라고 안내하세요.
- 일반 노무 질문(연차 등)은 근로기준법 기준으로 간단히 답하고, 정확한 적용은 담당자 확인이 필요하다고 덧붙이세요.
- 마크다운 표는 쓰지 말고 짧은 문장과 '- ' 목록만 사용하세요.

[데이터]
${JSON.stringify(aiContextData())}`;
  const messages = [...App.chat.turns.slice(-8), { role: 'user', content: q }];
  // API 키는 서버(functions/api/chat.js)에만 있다. 브라우저는 로그인 보호된 /api/chat만 호출한다.
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system, messages }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `오류 ${res.status}`);
  const text = String(body.text || '').trim() || '해당 정보를 찾을 수 없습니다.';
  App.chat.turns.push({ role: 'user', content: q }, { role: 'assistant', content: text });
  return { html: esc(text).replace(/\n/g, '<br>'), text };
}

function appendMsg(role, html, extraCls = '') {
  const box = document.getElementById('chatMsgs');
  const div = document.createElement('div');
  div.className = `msg ${role} ${extraCls}`;
  div.innerHTML = html;
  box.appendChild(div); box.scrollTop = box.scrollHeight;
  return div;
}
function htmlToText(html) { const tmp = document.createElement('div'); tmp.innerHTML = html; tmp.querySelectorAll('.go').forEach(x => x.remove()); return tmp.textContent.trim(); }
function logChat(question, answer, mode) {
  App.data.chatLogs.push({ id: uid(), question, answer, mode, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
  if (App.data.chatLogs.length > 100) App.data.chatLogs = App.data.chatLogs.slice(-100);
  saveCol('chatLogs');
}
async function askChat(q) {
  q = q.trim();
  if (!q || App.chat.busy) return;
  appendMsg('user', esc(q));
  const mode = chatMode();
  if (mode === 'rule') {
    const html = ruleBot(q);
    appendMsg('bot', html);
    logChat(q, htmlToText(html), 'rule');
    return;
  }
  App.chat.busy = true;
  const typing = appendMsg('bot', '답변을 작성하고 있어요…', 'typing');
  try {
    const { html, text } = await aiBot(q);
    typing.remove(); appendMsg('bot', html); logChat(q, text, 'ai');
  } catch (err) {
    typing.remove();
    const reason = err instanceof TypeError ? '네트워크 오류' : err.message;
    const html = `<span class="muted">AI 응답 실패 (${esc(reason)}) — 기본 모드로 답변합니다.</span><br>` + ruleBot(q);
    appendMsg('bot', html); logChat(q, htmlToText(html), 'rule-fallback');
  } finally { App.chat.busy = false; }
}
ACTIONS['chat-toggle'] = () => {
  App.chat.open = !App.chat.open;
  const panel = document.getElementById('chatPanel');
  panel.hidden = !App.chat.open;
  if (App.chat.open) {
    updateChatMode();
    if (!document.getElementById('chatMsgs').children.length) {
      const modeNote = chatMode() === 'ai' ? 'AI(OpenAI) 모드로 답합니다.' : '기본 모드로 답합니다. (AI 모드는 배포 사이트에서 사용)';
      appendMsg('bot', `안녕하세요! 인사 챗봇입니다. 저장된 인사 데이터를 조회해 답해 드려요.<br><span class="muted">${modeNote} 예시 질문을 누르거나 직접 입력해 보세요.</span>`);
    }
    document.getElementById('chatInput').focus();
  }
};
ACTIONS['chat-ask'] = q => askChat(q);

// ===== [초기화] =====
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('modal-backdrop')) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el.dataset.id, el, e);
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.filter;
  if (!k) return;
  App.filters[k] = e.target.value;
  render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'importFile' && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.modal-backdrop')) closeModal(); });
document.getElementById('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('chatInput');
  const q = input.value; input.value = '';
  askChat(q);
});
document.getElementById('chatChips').innerHTML = CHAT_EXAMPLES.map(q => `<button type="button" data-act="chat-ask" data-id="${esc(q)}">${esc(q)}</button>`).join('');

loadData();
render();
loadMe().then(() => { if (App.me && App.me.isAdmin) loadAccessState(); });
</script>
